<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bible Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bible Wordle</h1>
            <p>Guess the Bible word in 6 tries!</p>
        </header>

        <div class="game-board">
            <div class="grid" id="grid">
                <!-- Grid will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="keyboard" id="keyboard">
            <!-- Keyboard will be generated by JavaScript -->
        </div>
        
        <div hidden class="message" id="message"></div>
        
        <!-- Modal for game end -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2 id="modalTitle"></h2>
                <p id="modalMessage"></p>
                <div class="word-meaning">
                    <h3>Definition</h3>
                    <div id="wordMeaning">Loading meaning...</div>
                </div>

                <button id="copyResults" type="button">
                    Copy Results
                </button>
            </div>
        </div>
    </div>
    <script src="./env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
